# Kleine Kachel für die Leitseite: wird rot, sobald im Zigbee-Netz etwas auffällt
# (Gerät offline, Batterie niedrig/kritisch, Firmware-Update – je nach Einstellung).
# Ein Tipp öffnet das Zigbee-Dashboard.
# Die Entität passt du an: Einstellungen → Geräte & Dienste → Zigbee2MQTT Manager → Entität „Störung“ / „Problem“.
type: tile
entity: binary_sensor.zigbee2mqtt_manager_zigbee2mqtt_problem
name: Zigbee
icon: mdi:zigbee
color: red
state_content:
  - state
  - offline
  - low_battery
tap_action:
  action: navigate
  navigation_path: /dashboard-zigbee
