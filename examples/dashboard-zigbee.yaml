# Fertiges Dashboard für Zigbee2MQTT Manager.
# So geht's: Einstellungen → Dashboards → Dashboard hinzufügen (Titel „Zigbee“, URL-Pfad „zigbee“,
# also /dashboard-zigbee) → Dashboard öffnen → ⋮ → Bearbeiten → ⋮ → Rohkonfigurationseditor →
# den Inhalt dieser Datei (ohne die Kommentarzeilen) einfügen.
# Direkt zu den Dashboards: https://my.home-assistant.io/redirect/lovelace_dashboards/
title: Zigbee
views:
  - title: Zigbee
    path: zigbee
    icon: mdi:zigbee
    panel: true
    cards:
      - type: custom:zigbee2mqtt-manager-card
